name: Test skill scripts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build deterministic package
        run: python tools/package.py
      - name: Verify committed package matches source
        run: git diff --exit-code -- skills/chao-knowledge/manifest.json dist
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run three scripted user journeys
        run: python tools/acceptance.py
      - name: Verify current checkout with the real standard Skills CLI
        if: matrix.os == 'ubuntu-latest'
        run: python tools/verify_cli.py --checkout
      - name: Verify GitHub main through the real remote Skills CLI
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
        run: python tools/verify_cli.py
